name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "idphoto_studio_source.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      # =========================
      # 1. Checkout
      # =========================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # 2. 解压源码
      # =========================
      - name: Prepare source
        run: |
          set -e

          test -f idphoto_studio_source.zip

          rm -rf idphoto_studio

          unzip -q idphoto_studio_source.zip -d idphoto_studio

          test -f idphoto_studio/pubspec.yaml

          echo "===== Project ====="
          ls -la idphoto_studio

      # =========================
      # 3. Java 17
      # =========================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================
      # 4. Flutter 3.47.2
      # =========================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      # =========================
      # 5. Flutter version
      # =========================
      - name: Check Flutter
        run: |
          flutter --version
          dart --version

      # =========================
      # 6. BiRefNet ONNX
      # =========================
      - name: Download BiRefNet portrait ONNX
        working-directory: idphoto_studio
        run: |
          set -e

          mkdir -p assets/models

          curl -L \
            --fail \
            --retry 10 \
            --retry-delay 10 \
            --retry-all-errors \
            -o assets/models/birefnet_portrait_fp16.onnx \
            "https://huggingface.co/onnx-community/BiRefNet-portrait-ONNX/resolve/main/onnx/model_fp16.onnx?download=true"

          ls -lh assets/models/birefnet_portrait_fp16.onnx

          test -s assets/models/birefnet_portrait_fp16.onnx

      # =========================
      # 7. Flutter dependencies
      # =========================
      - name: Flutter pub get
        working-directory: idphoto_studio
        run: |
          set -e

          flutter clean

          flutter pub get

      # =========================
      # 8. 修复 desktop_drop
      #
      # desktop_drop 自己的 Android 模块
      # 使用 compileSdk 33。
      #
      # AndroidX 新依赖要求 >= 34。
      # =========================
      - name: Fix desktop_drop compileSdk
        run: |
          set -e

          echo "===== Searching desktop_drop ====="

          find "$HOME/.pub-cache" \
            -path "*desktop_drop*/android/*" \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print

          echo "===== Before ====="

          grep -R \
            -n \
            "compileSdk\|compileSdkVersion" \
            "$HOME/.pub-cache/hosted/pub.dev/desktop_drop-"*"/android" \
            2>/dev/null || true

          echo "===== Patching desktop_drop ====="

          find "$HOME/.pub-cache/hosted/pub.dev/" \
            -path "desktop_drop-*/android/build.gradle" \
            -type f \
            -exec sed -i -E \
            's/(compileSdkVersion[[:space:]]+|compileSdk[[:space:]]*[=:][[:space:]]*)33/\1 35/g' \
            {} \;

          find "$HOME/.pub-cache/hosted/pub.dev/" \
            -path "desktop_drop-*/android/build.gradle.kts" \
            -type f \
            -exec sed -i -E \
            's/(compileSdkVersion[[:space:]]+|compileSdk[[:space:]]*[=:][[:space:]]*)33/\1 35/g' \
            {} \;

          echo "===== After ====="

          grep -R \
            -n \
            "compileSdk\|compileSdkVersion" \
            "$HOME/.pub-cache/hosted/pub.dev/desktop_drop-"*"/android" \
            2>/dev/null || true

      # =========================
      # 9. 同时修复其他 Flutter
      #    插件的 compileSdk
      # =========================
      - name: Fix Flutter plugin compileSdk
        run: |
          set -e

          echo "===== Flutter plugin Android Gradle files ====="

          find "$HOME/.pub-cache/hosted/pub.dev" \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -path "*/android/*" \
            -print | head -100

          echo "===== Patching old compileSdk 33 ====="

          find "$HOME/.pub-cache/hosted/pub.dev" \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -path "*/android/*" \
            -exec sed -i -E \
            's/(compileSdkVersion[[:space:]]+|compileSdk[[:space:]]*[=:][[:space:]]*)33/\1 35/g' \
            {} \;

      # =========================
      # 10. 设置项目 Android compileSdk
      # =========================
      - name: Fix app compileSdk
        working-directory: idphoto_studio
        run: |
          set -e

          echo "===== Android Gradle files ====="

          grep -R \
            -n \
            "compileSdk\|compileSdkVersion" \
            android \
            --include="build.gradle" \
            --include="build.gradle.kts" \
            || true

          find android \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -exec sed -i -E \
            's/(compileSdkVersion[[:space:]]+|compileSdk[[:space:]]*[=:][[:space:]]*)33/\1 35/g' \
            {} \;

          echo "===== Final Android compileSdk ====="

          grep -R \
            -n \
            "compileSdk\|compileSdkVersion" \
            android \
            --include="build.gradle" \
            --include="build.gradle.kts" \
            || true

      # =========================
      # 11. 分析 Flutter
      # =========================
      - name: Flutter analyze
        working-directory: idphoto_studio
        run: |
          flutter analyze
        continue-on-error: true

      # =========================
      # 12. 构建 APK
      # =========================
      - name: Build release APK
        working-directory: idphoto_studio
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"
        run: |
          set -e

          flutter build apk --release

      # =========================
      # 13. 检查 APK
      # =========================
      - name: Check APK
        working-directory: idphoto_studio
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "===== APK ====="
          ls -lh "$APK"

          SIZE=$(stat -c%s "$APK")

          echo "APK size: $SIZE bytes"

          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: APK is too small."
            exit 1
          fi

      # =========================
      # 14. 上传 APK
      # =========================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: idphoto-birefnet-apk
          path: idphoto_studio/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30