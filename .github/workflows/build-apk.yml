name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "idphoto_studio_source.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ==============================
      # 1. 获取源码
      # ==============================
      - name: Checkout
        uses: actions/checkout@v4

      # ==============================
      # 2. 解压 Flutter 项目
      # ==============================
      - name: Prepare source
        run: |
          set -e

          test -f idphoto_studio_source.zip

          rm -rf idphoto_studio

          unzip -q idphoto_studio_source.zip -d idphoto_studio

          test -f idphoto_studio/pubspec.yaml

          echo "===== Flutter project ====="
          ls -la idphoto_studio

          echo "===== Android directory ====="
          ls -la idphoto_studio/android

      # ==============================
      # 3. Java 17
      # ==============================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==============================
      # 4. Flutter 3.47.2
      # ==============================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      # ==============================
      # 5. 显示 Flutter / Dart 版本
      # ==============================
      - name: Check Flutter
        run: |
          flutter --version
          dart --version

      # ==============================
      # 6. 修复 Android compileSdk
      #
      # 部分依赖要求 compileSdk >= 34
      # 这里统一提高到 35
      # ==============================
      - name: Update Android compileSdk
        working-directory: idphoto_studio
        run: |
          set -e

          echo "===== Before modification ====="
          grep -R "compileSdk" android \
            --include="build.gradle" \
            --include="build.gradle.kts" \
            || true

          find android -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print0 |
          xargs -0 sed -i -E \
            's/(compileSdk[[:space:]]+|compileSdkVersion[[:space:]]+)[0-9]+/\1 35/g'

          echo "===== After modification ====="
          grep -R "compileSdk" android \
            --include="build.gradle" \
            --include="build.gradle.kts" \
            || true

      # ==============================
      # 7. 检查 Android Gradle 文件
      # ==============================
      - name: Check Android configuration
        working-directory: idphoto_studio
        run: |
          echo "===== android/build.gradle ====="
          if [ -f android/build.gradle ]; then
            cat android/build.gradle
          fi

          echo "===== android/app/build.gradle ====="
          if [ -f android/app/build.gradle ]; then
            cat android/app/build.gradle
          fi

          echo "===== android/settings.gradle ====="
          if [ -f android/settings.gradle ]; then
            cat android/settings.gradle
          fi

      # ==============================
      # 8. 下载 BiRefNet Portrait ONNX
      # ==============================
      - name: Download BiRefNet portrait ONNX
        working-directory: idphoto_studio
        run: |
          set -e

          mkdir -p assets/models

          echo "Downloading BiRefNet Portrait FP16..."

          curl -L \
            --fail \
            --retry 10 \
            --retry-delay 10 \
            --retry-all-errors \
            -o assets/models/birefnet_portrait_fp16.onnx \
            "https://huggingface.co/onnx-community/BiRefNet-portrait-ONNX/resolve/main/onnx/model_fp16.onnx?download=true"

          echo "===== Model information ====="
          ls -lh assets/models/birefnet_portrait_fp16.onnx

          test -s assets/models/birefnet_portrait_fp16.onnx

      # ==============================
      # 9. 检查模型
      # ==============================
      - name: Check BiRefNet model
        working-directory: idphoto_studio
        run: |
          set -e

          MODEL="assets/models/birefnet_portrait_fp16.onnx"

          if [ ! -f "$MODEL" ]; then
            echo "ERROR: BiRefNet model not found"
            exit 1
          fi

          SIZE=$(stat -c%s "$MODEL")

          echo "BiRefNet model size: $SIZE bytes"

          if [ "$SIZE" -lt 100000000 ]; then
            echo "ERROR: Model file looks too small"
            exit 1
          fi

          echo "BiRefNet model exists."

      # ==============================
      # 10. Flutter 依赖
      # ==============================
      - name: Flutter pub get
        working-directory: idphoto_studio
        run: |
          set -e

          flutter clean
          flutter pub get

      # ==============================
      # 11. 显示 Flutter 包信息
      # ==============================
      - name: Flutter packages
        working-directory: idphoto_studio
        run: |
          flutter pub deps

      # ==============================
      # 12. 分析 Dart
      # ==============================
      - name: Flutter analyze
        working-directory: idphoto_studio
        run: |
          flutter analyze
        continue-on-error: true

      # ==============================
      # 13. 构建 Release APK
      # ==============================
      - name: Build release APK
        working-directory: idphoto_studio
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"
        run: |
          set -e

          flutter build apk --release

      # ==============================
      # 14. 检查 APK
      # ==============================
      - name: Check APK
        working-directory: idphoto_studio
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "===== APK ====="
          ls -lh "$APK"

          SIZE=$(stat -c%s "$APK")

          echo "APK size: $SIZE bytes"

          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: APK looks too small."
            exit 1
          fi

      # ==============================
      # 15. 上传 APK
      # ==============================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: idphoto-birefnet-apk
          path: idphoto_studio/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30