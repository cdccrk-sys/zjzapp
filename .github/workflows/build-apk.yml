name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "idphoto_studio_source.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare source
        run: |
          set -e

          test -f idphoto_studio_source.zip

          rm -rf idphoto_studio

          unzip -q idphoto_studio_source.zip -d idphoto_studio

          test -f idphoto_studio/pubspec.yaml

          echo "===== Project ====="
          ls -la idphoto_studio

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Check Flutter
        run: |
          flutter --version
          dart --version

      - name: Download BiRefNet portrait ONNX
        working-directory: idphoto_studio
        run: |
          set -e

          mkdir -p assets/models

          curl -L \
            --fail \
            --retry 10 \
            --retry-delay 10 \
            --retry-all-errors \
            -o assets/models/birefnet_portrait_fp16.onnx \
            "https://huggingface.co/onnx-community/BiRefNet-portrait-ONNX/resolve/main/onnx/model_fp16.onnx?download=true"

          ls -lh assets/models/birefnet_portrait_fp16.onnx

          test -s assets/models/birefnet_portrait_fp16.onnx

      - name: Flutter pub get
        working-directory: idphoto_studio
        run: |
          set -e

          flutter clean
          flutter pub get

      # ==================================================
      # 强制修复所有 Flutter 插件的 Android compileSdk
      # ==================================================
      - name: Fix all Flutter plugin compileSdk
        run: |
          set -e

          PUB="$HOME/.pub-cache/hosted/pub.dev"

          echo "========================================"
          echo "Searching Flutter plugin Android projects"
          echo "========================================"

          find "$PUB" \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -path "*/android/*" \
            -print

          echo "========================================"
          echo "BEFORE PATCH"
          echo "========================================"

          grep -R -n -E \
            'compileSdk(Vers?ion)?[[:space:]]*([=:][[:space:]]*)?[0-9]+' \
            "$PUB" \
            --include="build.gradle" \
            --include="build.gradle.kts" \
            2>/dev/null || true

          echo "========================================"
          echo "PATCH compileSdk 33 -> 35"
          echo "========================================"

          find "$PUB" \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -path "*/android/*" \
            -exec sed -i -E \
            's/(compileSdkVersion|compileSdk)([[:space:]]*[:=]?[[:space:]]*)33/\1\2 35/g' \
            {} \;

          echo "========================================"
          echo "AFTER PATCH"
          echo "========================================"

          grep -R -n -E \
            'compileSdk(Vers?ion)?[[:space:]]*([=:][[:space:]]*)?[0-9]+' \
            "$PUB" \
            --include="build.gradle" \
            --include="build.gradle.kts" \
            2>/dev/null || true

      # ==================================================
      # 专门检查 desktop_drop
      # ==================================================
      - name: Verify desktop_drop
        run: |
          set -e

          echo "========================================"
          echo "desktop_drop files"
          echo "========================================"

          find "$HOME/.pub-cache/hosted/pub.dev" \
            -path "*/desktop_drop-*/android/*" \
            -type f \
            -print || true

          echo "========================================"
          echo "desktop_drop compileSdk"
          echo "========================================"

          grep -R -n -E \
            'compileSdk(Vers?ion)?' \
            "$HOME/.pub-cache/hosted/pub.dev"/desktop_drop-* \
            --include="build.gradle" \
            --include="build.gradle.kts" \
            2>/dev/null || true

      # ==================================================
      # 再次修复项目自身 Android 配置
      # ==================================================
      - name: Fix project Android compileSdk
        working-directory: idphoto_studio
        run: |
          set -e

          echo "========================================"
          echo "Project compileSdk BEFORE"
          echo "========================================"

          grep -R -n -E \
            'compileSdk(Vers?ion)?' \
            android \
            --include="build.gradle" \
            --include="build.gradle.kts" \
            2>/dev/null || true

          find android \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -exec sed -i -E \
            's/(compileSdkVersion|compileSdk)([[:space:]]*[:=]?[[:space:]]*)33/\1\2 35/g' \
            {} \;

          echo "========================================"
          echo "Project compileSdk AFTER"
          echo "========================================"

          grep -R -n -E \
            'compileSdk(Vers?ion)?' \
            android \
            --include="build.gradle" \
            --include="build.gradle.kts" \
            2>/dev/null || true

      - name: Flutter analyze
        working-directory: idphoto_studio
        run: |
          flutter analyze
        continue-on-error: true

      # ==================================================
      # 构建 APK
      # ==================================================
      - name: Build release APK
        working-directory: idphoto_studio
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"
        run: |
          set -e

          flutter build apk --release

      - name: Check APK
        working-directory: idphoto_studio
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "========================================"
          echo "APK generated successfully"
          echo "========================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: idphoto-birefnet-apk
          path: idphoto_studio/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30